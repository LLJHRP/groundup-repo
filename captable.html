const ITERS = 600000;

// ---- crypto helpers (WebCrypto) ----
function hexToBytes(h){const a=new Uint8Array(h.length/2);for(let i=0;i<a.length;i++)a[i]=parseInt(h.substr(i*2,2),16);return a;}
function bytesToHex(b){return Array.from(b).map(x=>x.toString(16).padStart(2,"0")).join("");}

async function pbkdf2(passBytes, saltBytes, iters, lenBytes){
  const key = await crypto.subtle.importKey("raw", passBytes, {name:"PBKDF2"}, false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits(
    {name:"PBKDF2", salt:saltBytes, iterations:iters, hash:"SHA-256"},
    key, lenBytes*8
  );
  return new Uint8Array(bits);
}

async function hmacSha256Hex(keyBytes, msgStr){
  const k = await crypto.subtle.importKey("raw", keyBytes, {name:"HMAC", hash:"SHA-256"}, false, ["sign"]);
  const sig = await crypto.subtle.sign("HMAC", k, new TextEncoder().encode(msgStr));
  return bytesToHex(new Uint8Array(sig));
}

async function decryptAesCbc(keyBytes, ivBytes, ctBytes){
  const k = await crypto.subtle.importKey("raw", keyBytes, {name:"AES-CBC"}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-CBC", iv:ivBytes}, k, ctBytes);
  return new TextDecoder().decode(pt);
}

async function tryUnlock(pw){
  const saltBytes = new TextEncoder().encode(SALT); // salt is the hex string itself, as bytes
  const pwBytes = new TextEncoder().encode(pw);

  // 1) derive 32B key
  const key = await pbkdf2(pwBytes, saltBytes, ITERS, 32);
  // 2) hmac key = PBKDF2(hex(key), salt, 1, 32)
  const keyHexBytes = new TextEncoder().encode(bytesToHex(key));
  const hmacKey = await pbkdf2(keyHexBytes, saltBytes, 1, 32);

  // split payload: first 64 hex chars = hmac signature, rest = iv||ct
  const sig = PAYLOAD.slice(0, 64);
  const encHex = PAYLOAD.slice(64);

  // verify hmac
  const expected = await hmacSha256Hex(hmacKey, SALT + encHex);
  if (expected !== sig) throw new Error("Wrong password");

  // decrypt
  const ivBytes = hexToBytes(encHex.slice(0,32));
  const ctBytes = hexToBytes(encHex.slice(32));
  return await decryptAesCbc(key, ivBytes, ctBytes);
}

document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  const btn = document.getElementById("btn");
  const err = document.getElementById("err");
  err.textContent = "";
  btn.disabled = true; btn.textContent = "Decrypting…";
  try {
    const html = await tryUnlock(pw);
    document.open();
    document.write(html);
    document.close();
  } catch (ex) {
    err.textContent = "Wrong password. Try again.";
    btn.disabled = false; btn.textContent = "Unlock";
    document.getElementById("pw").select();
  }
});
