function b64ToBytes(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
async function decrypt(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64ToBytes(PAYLOAD.salt), iterations: PAYLOAD.iterations, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["decrypt"]
  );
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64ToBytes(PAYLOAD.iv) }, key, b64ToBytes(PAYLOAD.ct));
  return new TextDecoder().decode(plain);
}
async function unlock() {
  const btn = document.getElementById("go");
  const err = document.getElementById("err");
  const pw = document.getElementById("pw").value;
  err.textContent = "";
  btn.disabled = true;
  btn.textContent = "Unlocking…";
  try {
    const html = await decrypt(pw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    err.textContent = "Wrong password";
    btn.disabled = false;
    btn.textContent = "Unlock";
  }
}
document.getElementById("go").addEventListener("click", unlock);
document.getElementById("pw").addEventListener("keydown", (e) => { if (e.key === "Enter") unlock(); });
